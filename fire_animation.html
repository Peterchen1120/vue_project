<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Animation Test</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08081e;
        --panel: rgba(10, 12, 31, 0.72);
        --line: rgba(255, 191, 65, 0.22);
        --text: #fff4c7;
        --muted: #b7a985;
        --ember: #ffb21a;
        --hot: #ff6a00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 58%, rgba(255, 140, 18, 0.2), transparent 22rem),
          radial-gradient(circle at 20% 20%, rgba(255, 203, 73, 0.1), transparent 18rem),
          linear-gradient(145deg, #040314, var(--bg) 48%, #11101d);
        font-family:
          "Trebuchet MS",
          "Microsoft JhengHei",
          sans-serif;
        color: var(--text);
      }

      .stage {
        width: min(92vw, 780px);
        display: grid;
        gap: 18px;
        justify-items: center;
      }

      .title {
        margin: 0;
        font-size: clamp(24px, 5vw, 54px);
        font-weight: 800;
        letter-spacing: 0;
        text-align: center;
        color: #ffd35a;
        text-shadow:
          0 0 18px rgba(255, 118, 0, 0.8),
          0 4px 0 rgba(0, 0, 0, 0.35);
      }

      .viewport {
        position: relative;
        width: min(88vw, 430px);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 62%, rgba(255, 203, 51, 0.24), transparent 40%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
        box-shadow:
          inset 0 0 48px rgba(255, 174, 31, 0.08),
          0 32px 90px rgba(0, 0, 0, 0.42);
      }

      canvas {
        width: 82%;
        height: 82%;
        image-rendering: auto;
        filter:
          drop-shadow(0 0 20px rgba(255, 120, 0, 0.74))
          drop-shadow(0 0 46px rgba(255, 199, 30, 0.28));
        transform-origin: 50% 82%;
        animation: heat-pulse 780ms ease-in-out infinite alternate;
      }

      .floor-glow {
        position: absolute;
        width: 58%;
        height: 11%;
        left: 21%;
        bottom: 12%;
        border-radius: 999px;
        background: radial-gradient(ellipse, rgba(255, 113, 0, 0.42), transparent 68%);
        filter: blur(6px);
        pointer-events: none;
      }

      .embers {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .ember {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ember);
        box-shadow: 0 0 14px rgba(255, 178, 26, 0.9);
        animation: rise 1.8s linear infinite;
      }

      .ember:nth-child(1) {
        left: 36%;
        bottom: 30%;
        animation-delay: -0.2s;
      }

      .ember:nth-child(2) {
        left: 57%;
        bottom: 34%;
        animation-delay: -0.7s;
        transform: scale(0.75);
      }

      .ember:nth-child(3) {
        left: 47%;
        bottom: 22%;
        animation-delay: -1.1s;
        transform: scale(1.2);
      }

      .controls {
        width: min(88vw, 430px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: var(--panel);
        backdrop-filter: blur(14px);
      }

      button {
        min-width: 82px;
        height: 42px;
        border: 0;
        border-radius: 6px;
        background: linear-gradient(180deg, #ffd257, #ff7b00);
        color: #1d0b00;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(255, 111, 0, 0.22);
      }

      label {
        display: grid;
        gap: 5px;
        flex: 1;
        min-width: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--hot);
      }

      .meta {
        margin: 0;
        max-width: 520px;
        color: rgba(255, 244, 199, 0.72);
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
      }

      @keyframes heat-pulse {
        from {
          filter:
            drop-shadow(0 0 18px rgba(255, 120, 0, 0.68))
            drop-shadow(0 0 38px rgba(255, 199, 30, 0.22));
        }

        to {
          filter:
            drop-shadow(0 0 22px rgba(255, 120, 0, 0.82))
            drop-shadow(0 0 54px rgba(255, 199, 30, 0.34));
        }
      }

      @keyframes rise {
        0% {
          opacity: 0;
          translate: 0 0;
        }

        12% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          translate: 20px -150px;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <h1 class="title">Fire Animation Test</h1>
      <section class="viewport" aria-label="flame animation preview">
        <div class="embers">
          <span class="ember"></span>
          <span class="ember"></span>
          <span class="ember"></span>
        </div>
        <canvas id="flame" width="512" height="512"></canvas>
        <div class="floor-glow"></div>
      </section>

      <div class="controls">
        <button id="toggle" type="button">Pause</button>
        <label>
          Speed
          <input id="speed" type="range" min="45" max="220" value="75" />
        </label>
      </div>

      <p class="meta">
        This test plays newly generated transparent PNG frames based on the
        source flame style, with extra outer tongues appearing across frames.
      </p>
    </main>

    <script>
      const canvas = document.querySelector("#flame");
      const ctx = canvas.getContext("2d");
      const toggle = document.querySelector("#toggle");
      const speed = document.querySelector("#speed");
      const preparedFrames = [];
      const frameFiles = Array.from(
        { length: 18 },
        (_, index) => `./fire_generated_frames/fire_${String(index).padStart(2, "0")}.png`
      );
      let currentFrame = 0;
      let isPlaying = true;
      let lastTick = 0;

      function drawFrame(frameIndex) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(preparedFrames[frameIndex], 0, 0);
      }

      function animate(timestamp) {
        if (isPlaying && timestamp - lastTick > Number(speed.value)) {
          currentFrame = (currentFrame + 1) % preparedFrames.length;
          drawFrame(currentFrame);
          lastTick = timestamp;
        }

        requestAnimationFrame(animate);
      }

      toggle.addEventListener("click", () => {
        isPlaying = !isPlaying;
        toggle.textContent = isPlaying ? "Pause" : "Play";
      });

      Promise.all(
        frameFiles.map(
          (src) =>
            new Promise((resolve, reject) => {
              const image = new Image();
              image.onload = () => resolve(image);
              image.onerror = reject;
              image.src = src;
            })
        )
      )
        .then((frames) => {
          preparedFrames.push(...frames);
          drawFrame(0);
          requestAnimationFrame(animate);
        })
        .catch(() => {
          ctx.fillStyle = "#fff4c7";
          ctx.font = "20px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText("Frames failed to load", 256, 246);
        });
    </script>
  </body>
</html>
