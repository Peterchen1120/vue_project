<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Magic Islands Map Demo</title>
    <style>
      :root {
        --ink: #203044;
        --panel: #fff8e2;
        --panel-strong: #f4d384;
        --sea: #62cfd4;
        --focus: #fff1a6;
        --shadow: 0 18px 40px rgba(37, 69, 94, 0.24);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Trebuchet MS", "Noto Sans TC", sans-serif;
        background:
          radial-gradient(circle at 10% 8%, rgba(255, 246, 176, 0.78), transparent 18rem),
          linear-gradient(180deg, #a6edf1 0%, #5fcbd1 100%);
      }

      .demo-shell {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 24px;
      }

      .map-frame {
        position: relative;
        overflow: hidden;
        border: 10px solid rgba(255, 248, 226, 0.92);
        border-radius: 18px;
        background: var(--sea);
        box-shadow: var(--shadow);
        aspect-ratio: 1672 / 941;
      }

      /* ?芸?????湔摮?蝝?憟?冽遛摰?嚗over ??img 銝?敶梢 */
      /* direct-child only, 避免蓋掉 mover img */
      .map-frame > img,
      .map-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .map-frame > img {
        display: block;
        object-fit: cover;
      }

      .map-layer { overflow: visible; }

      /* ── mover 層 ── */
      .mover-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .mover-layer img {
        position: absolute;
        inset: unset;
        width: var(--w, 8%);
        height: auto;
        left: var(--x, 0);
        top:  var(--y, 0);
      }

      /* ── 海豚動畫：拋物線圓弧，linear 計時確保流暢 ── */
      .mover--dolphin-jump {
        animation: dolphin-jump var(--speed, 9s) linear infinite;
      }
      .mover--dolphin-jump-left {
        animation: dolphin-jump-left var(--speed, 9s) linear infinite;
        animation-delay: var(--delay, 0s);
      }
      @keyframes dolphin-jump {
        /* 由左往右：出水鼻朝上（負角）→ 頂點水平 → 入水鼻朝下（正角）*/
        0%        { transform: translate(  0px,  14px) rotate(-28deg); opacity: 0;   }
        1%        { transform: translate(  4px,   5px) rotate(-20deg); opacity: 1;   }
        4%        { transform: translate( 14px,  -6px) rotate(-11deg); opacity: 1;   }
        7%        { transform: translate( 26px, -16px) rotate( -3deg); opacity: 1;   }
        9%        { transform: translate( 34px, -20px) rotate(  0deg); opacity: 1;   }
        12%       { transform: translate( 46px, -15px) rotate( 20deg); opacity: 1;   }
        15%       { transform: translate( 58px,  -3px) rotate( 42deg); opacity: 1;   }
        17%       { transform: translate( 66px,   5px) rotate( 58deg); opacity: 0.5; }
        18%       { transform: translate( 70px,  14px) rotate( 70deg); opacity: 0;   }
        19%, 100% { transform: translate(  0px,  14px) rotate(-28deg); opacity: 0;   }
      }
      @keyframes dolphin-jump-left {
        /* scaleX(-1) 鏡射：x/rotation 值和 dolphin-jump 相同，視覺上完全對稱 */
        0%        { transform: scaleX(-1) translate(  0px,  14px) rotate(-28deg); opacity: 0;   }
        1%        { transform: scaleX(-1) translate(  4px,   5px) rotate(-20deg); opacity: 1;   }
        4%        { transform: scaleX(-1) translate( 14px,  -6px) rotate(-11deg); opacity: 1;   }
        7%        { transform: scaleX(-1) translate( 26px, -16px) rotate( -3deg); opacity: 1;   }
        9%        { transform: scaleX(-1) translate( 34px, -20px) rotate(  0deg); opacity: 1;   }
        12%       { transform: scaleX(-1) translate( 46px, -15px) rotate( 20deg); opacity: 1;   }
        15%       { transform: scaleX(-1) translate( 58px,  -3px) rotate( 42deg); opacity: 1;   }
        17%       { transform: scaleX(-1) translate( 66px,   5px) rotate( 58deg); opacity: 0.5; }
        18%       { transform: scaleX(-1) translate( 70px,  14px) rotate( 70deg); opacity: 0;   }
        19%, 100% { transform: scaleX(-1) translate(  0px,  14px) rotate(-28deg); opacity: 0;   }
      }

      /* ?? Hotspots ?? */
      .hotspot { cursor: pointer; outline: none; }
      .hotspot path {
        fill: rgba(255, 245, 160, 0.02);
        stroke: transparent;
        stroke-width: 8;
        transition: fill 0.18s ease, stroke 0.18s ease, filter 0.18s ease;
      }
      .hotspot:hover path,
      .hotspot:focus path,
      .hotspot.is-active path {
        fill: rgba(255, 241, 166, 0.2);
        stroke: rgba(255, 241, 166, 0.96);
        filter: drop-shadow(0 0 14px rgba(255, 238, 126, 0.86));
      }

      /* ??????????????????????????????????????????
         WIND TURBINES
         Fix: transform-origin 50% 66.7% so the pivot
         lands on the hub (0,0) inside the fill-box.
         Bounding box: x[-50,50] y[-58,29] ??height 87
         Hub y=0 ??58/87 ??66.7% from top
      ?????????????????????????????????????????? */
      .turbine-blades {
        animation: spin 5s linear infinite;
        transform-box: fill-box;
        transform-origin: 50% 66.7%;
      }

      .blade-line {
        stroke: #fffefa;
        stroke-width: 9;
        stroke-linecap: round;
        filter: drop-shadow(0 2px 2px rgba(72, 103, 116, 0.32));
      }
      .blade-hub {
        fill: #fffefa;
        stroke: #dce8ea;
        stroke-width: 3;
      }

      /* ??????????????????????????????????????????
         SMOKE PUFFS
         ?耦?嚗???? 3 憿?circle嚗?撌桀辣??         敶Ｘ????銝?瘚ransform-box + transform-origin
         霈?scale 隞亙?敹?粹??刻嚗????箏??      ?????????????????????????????????????????? */
      .smoke {
        opacity: 0;
        animation: smoke-rise 3.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
        filter: url(#smoke-blur);
      }
      .smoke.geo  { animation-duration: 3.8s; }
      .smoke.bio  { animation-duration: 3.1s; }
      .smoke.d1   { animation-delay: 1.13s; }
      .smoke.d2   { animation-delay: 2.27s; }

      /* ??????????????????????????????????????????
         WATER / HYDRO
         閬?撘???瘚? overlay嚗?         瘥?????clipPath 獢????
         pattern 撣嗥?瞍詨惜敺瘚??孵??脣?嚗?         霈??臬????絲靘??瘚???      ?????????????????????????????????????????? */
      .ripple {
        fill: none;
        stroke: rgba(180, 245, 255, 0.7);
        stroke-width: 2.5;
      }

      /* ??????????????????????????????????????????
         SUN (Solar Isle)
         Replaced 3 floating circles with a proper
         sun disc + rotating rays element.
      ?????????????????????????????????????????? */
      .sun-disc {
        fill: #ffe066;
        animation: sun-disc-pulse 2.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .sun-halo {
        fill: rgba(255, 218, 60, 0.22);
        animation: sun-disc-pulse 2.6s ease-in-out infinite reverse;
        transform-box: fill-box;
        transform-origin: center;
      }
      .sun-rays-group {
        animation: sun-rays-rotate 14s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .sun-ray {
        stroke: #ffe566;
        stroke-linecap: round;
        opacity: 0.85;
      }

      /* Solar panel sparkle glints ??蝝?opacity嚗??SVG transform-box ?詨捆?? */
      .sparkle        { opacity: 0; animation: sparkle-appear 3.8s ease-in-out infinite; }
      .sparkle.s2     { animation-delay: -0.76s; }
      .sparkle.s3     { animation-delay: -1.52s; }
      .sparkle.s4     { animation-delay: -2.28s; }
      .sparkle.s5     { animation-delay: -3.04s; }
      @keyframes sparkle-appear {
        0%,  8%       { opacity: 0;    }
        20%, 35%      { opacity: 1;    }
        50%, 100%     { opacity: 0;    }
      }

      /* ??????????????????????????????????????????
         KEYFRAMES
      ?????????????????????????????????????????? */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Smoke puff: 敺???嫣蒂銝?嚗誑 fill-box ??蝮格銝?蝘?*/
      @keyframes smoke-rise {
        0%   { opacity: 0;    transform: translateY(0)     scale(0.35); }
        18%  { opacity: 0.75; }
        70%  { opacity: 0.42; }
        100% { opacity: 0;    transform: translateY(-62px) scale(2.2);  }
      }


      @keyframes sun-disc-pulse {
        0%, 100% { transform: scale(1);    opacity: 0.88; }
        50%      { transform: scale(1.1);  opacity: 1;    }
      }

      @keyframes sun-rays-rotate {
        to { transform: rotate(45deg); }
      }

      /* ?? UI ?? */
      .tooltip {
        position: absolute;
        left: var(--x, 50%);
        top: var(--y, 50%);
        translate: -50% -120%;
        pointer-events: none;
        padding: 9px 13px;
        border: 2px solid #7b4b21;
        border-radius: 999px;
        background: var(--panel);
        color: #422911;
        font-size: 0.9rem;
        font-weight: 900;
        box-shadow: 0 8px 18px rgba(72, 50, 28, 0.18);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.16s ease, transform 0.16s ease;
      }
      .tooltip.is-visible { opacity: 1; transform: translateY(0); }

      .control-dock {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        margin-top: 18px;
        padding: 16px;
        border: 3px solid rgba(123, 75, 33, 0.34);
        border-radius: 14px;
        background: rgba(255, 248, 226, 0.9);
        box-shadow: 0 10px 26px rgba(37, 69, 94, 0.14);
      }
      .info-panel h1 {
        margin: 0 0 4px;
        font-size: clamp(1.2rem, 2.2vw, 2rem);
        line-height: 1.1;
        color: #4b3218;
      }
      .info-panel p {
        margin: 0;
        color: #5f5140;
        font-size: 0.98rem;
        line-height: 1.55;
      }
      .energy-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .energy-button {
        min-width: 7.3rem;
        border: 2px solid #76502b;
        border-radius: 999px;
        padding: 10px 14px;
        background: #fff2b8;
        color: #43290f;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 900;
        cursor: pointer;
        transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      }
      .energy-button:hover,
      .energy-button:focus,
      .energy-button.is-active {
        background: #ffd45f;
        box-shadow: 0 7px 0 rgba(118, 80, 43, 0.28);
        transform: translateY(-4px);
        outline: none;
      }

      @media (max-width: 820px) {
        .demo-shell { padding: 12px; }
        .map-frame { border-width: 5px; border-radius: 12px; }
        .control-dock { grid-template-columns: 1fr; }
        .energy-buttons { justify-content: flex-start; }
        .energy-button { min-width: auto; flex: 1 1 8rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <section class="map-frame" aria-label="Energy Magic Islands interactive map">
        <img src="./energy-map-clean-no-movers.png" alt="Energy Magic Islands clean map" />

        <svg class="map-layer" viewBox="0 0 1672 941" role="img" aria-label="Animated energy map overlays">
          <defs>
            <!-- Blade set: hub at (0,0), blades extend outward -->
            <g id="blade-set">
              <line class="blade-line" x1="0" y1="0" x2="0"   y2="-58" />
              <line class="blade-line" x1="0" y1="0" x2="50"  y2="29"  />
              <line class="blade-line" x1="0" y1="0" x2="-50" y2="29"  />
              <circle class="blade-hub" cx="0" cy="0" r="10" />
            </g>
            <!-- Waterfall edge softening -->
            <filter id="wf-blur" x="-30%" y="-10%" width="160%" height="120%">
              <feGaussianBlur stdDeviation="1.2"/>
            </filter>

            <!-- ?? ?? ClipPath嚗???????蝎曄Ⅱ鞎澆?瘞湔??? ??
                 WF1: 撌血瘞湧?  y=244-281嚗蝺????嗆?
                 WF2: 銝剖椰?  y=214-280嚗?◤????x=970
                 WF3: 銝剖?  y=230-290嚗椰?????x=981 韏?                 WF4: ?喳瘞湧?  y=270-300嚗?畾?y=248-256 ?函???嚗?            ???????????????????????????????????????????????? -->
            <clipPath id="wf1-clip">
              <polygon points="826,244 848,244 836,281 813,281"/>
            </clipPath>
            <clipPath id="wf2-clip">
              <polygon points="936,214 970,214 970,280 921,280"/>
            </clipPath>
            <clipPath id="wf3-clip">
              <polygon points="991,230 1019,230 1007,290 985,290"/>
            </clipPath>
            <clipPath id="wf4-clip">
              <polygon points="1086,270 1106,270 1100,300 1070,300"/>
            </clipPath>

            <!-- ??撣嗥? pattern嚗 JS ??撠???瘚?敺??脣?嚗?                 瘞游像撣嗅 patternTransform rotate 敺停??朣??????湔???-->
            <pattern id="wf1-pat" x="0" y="0" width="80" height="20" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="6"  fill="rgba(186,232,255,0.48)"/>
              <rect y="6"  width="80" height="3"  fill="rgba(255,255,255,0.75)"/>
              <rect y="9"  width="80" height="5"  fill="rgba(148,210,245,0.32)"/>
              <rect y="14" width="80" height="6"  fill="rgba(186,230,255,0.10)"/>
            </pattern>
            <pattern id="wf2-pat" x="0" y="0" width="80" height="20" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="6"  fill="rgba(186,232,255,0.48)"/>
              <rect y="6"  width="80" height="3"  fill="rgba(255,255,255,0.75)"/>
              <rect y="9"  width="80" height="5"  fill="rgba(148,210,245,0.32)"/>
              <rect y="14" width="80" height="6"  fill="rgba(186,230,255,0.10)"/>
            </pattern>
            <pattern id="wf3-pat" x="0" y="0" width="80" height="20" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="6"  fill="rgba(186,232,255,0.48)"/>
              <rect y="6"  width="80" height="3"  fill="rgba(255,255,255,0.75)"/>
              <rect y="9"  width="80" height="5"  fill="rgba(148,210,245,0.32)"/>
              <rect y="14" width="80" height="6"  fill="rgba(186,230,255,0.10)"/>
            </pattern>
            <pattern id="wf4-pat" x="0" y="0" width="80" height="20" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="6"  fill="rgba(186,232,255,0.48)"/>
              <rect y="6"  width="80" height="3"  fill="rgba(255,255,255,0.75)"/>
              <rect y="9"  width="80" height="5"  fill="rgba(148,210,245,0.32)"/>
              <rect y="14" width="80" height="6"  fill="rgba(186,230,255,0.10)"/>
            </pattern>
            <!-- Smoke blur -->
            <filter id="smoke-blur" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="4" />
            </filter>
          </defs>

          <g aria-hidden="true">

            <!-- ?? WIND: 5 turbines ?? -->
            <!-- 憭惜 g嚗? SVG 撅祆批?雿?銝１ CSS transform嚗?                 ?批惜 g嚗? CSS animation ??嚗 SVG transform 撅祆改?
                 ?拙惜???甇?Ⅱ??嚗????貉???              -->
            <g transform="translate(391,118)">
              <g class="turbine-blades"><use href="#blade-set" /></g>
            </g>
            <g transform="translate(505,198)">
              <g class="turbine-blades" style="animation-duration:4.6s"><use href="#blade-set" /></g>
            </g>
            <g transform="translate(590,288) scale(0.78)">
              <g class="turbine-blades" style="animation-duration:5.4s"><use href="#blade-set" /></g>
            </g>
            <g transform="translate(324,165) scale(0.58)">
              <g class="turbine-blades" style="animation-duration:6.0s"><use href="#blade-set" /></g>
            </g>
            <g transform="translate(456,162) scale(0.54)">
              <g class="turbine-blades" style="animation-duration:5.8s"><use href="#blade-set" /></g>
            </g>

            <!-- ?? HYDRO: 閬?撘?瘚? overlay嚗? ?偌瘚??? -->

            <!-- ?? overlay嚗atternTransform rotate ??JS 靘??身摰?-->
            <g clip-path="url(#wf1-clip)">
              <rect x="808" y="242" width="46" height="100"
                    fill="url(#wf1-pat)" opacity="0.90"/>
            </g>
            <g clip-path="url(#wf2-clip)">
              <rect x="918" y="212" width="56" height="120"
                    fill="url(#wf2-pat)" opacity="0.90"/>
            </g>
            <g clip-path="url(#wf3-clip)">
              <rect x="983" y="228" width="40" height="115"
                    fill="url(#wf3-pat)" opacity="0.90"/>
            </g>
            <g clip-path="url(#wf4-clip)">
              <rect x="1066" y="268" width="46" height="85"
                    fill="url(#wf4-pat)" opacity="0.90"/>
            </g>

            <!-- 皝瞍?憚嚗???4 璇??賣偌暺?-->
            <circle class="ripple" cx="812" cy="322" r="6"><animate attributeName="r" from="6" to="26" dur="2.1s" begin="0s"    repeatCount="indefinite"/><animate attributeName="opacity" from="0.7" to="0" dur="2.1s" begin="0s"    repeatCount="indefinite"/></circle>

    <script>
      const energyCopy = {
        wind:       { title: "Wind Isle",       label: "Wind Isle",       description: "Wind power harnesses natural breeze to generate clean electricity.",              x: "27%", y: "27%" },
        hydro:      { title: "Hydro Isle",      label: "Hydro Isle",      description: "Hydro power converts flowing water into renewable energy.",             x: "57%", y: "27%" },
        solar:      { title: "Solar Isle",      label: "Solar Isle",      description: "Solar panels capture sunlight and convert it to electrical power.",     x: "84%", y: "43%" },
        nuclear:    { title: "Nuclear Isle",    label: "Nuclear Isle",    description: "Nuclear fission releases enormous energy with zero carbon emissions.",         x: "22%", y: "61%" },
        biomass:    { title: "Biomass Isle",    label: "Biomass Isle",    description: "Biomass energy converts organic materials into usable fuel and power.",             x: "47%", y: "74%" },
        geothermal: { title: "Geothermal Isle", label: "Geothermal Isle", description: "Geothermal energy taps heat from deep within the Earth.",             x: "80%", y: "75%" },
      };

      const tooltip    = document.querySelector("#tooltip");
      const titleEl    = document.querySelector("#energyTitle");
      const descEl     = document.querySelector("#energyDescription");
      const items      = document.querySelectorAll("[data-energy]");

      function setActive(type) {
        const item = energyCopy[type];
        if (!item) return;
        titleEl.textContent       = item.title;
        descEl.textContent        = item.description;
        tooltip.textContent       = item.label;
        tooltip.style.setProperty("--x", item.x);
        tooltip.style.setProperty("--y", item.y);
        tooltip.classList.add("is-visible");
        items.forEach(n => n.classList.toggle("is-active", n.dataset.energy === type));
      }

      items.forEach(node => {
        node.addEventListener("click",     () => setActive(node.dataset.energy));
        node.addEventListener("mouseenter",() => setActive(node.dataset.energy));
        node.addEventListener("focus",     () => setActive(node.dataset.energy));
        node.addEventListener("keydown",   e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setActive(node.dataset.energy); }
        });
      });

      setActive("wind");

      // ── 瀑布流動 ──
      (function () {
        const wf1 = document.getElementById('wf1-pat');
        const wf2 = document.getElementById('wf2-pat');
        const wf3 = document.getElementById('wf3-pat');
        const wf4 = document.getElementById('wf4-pat');
        let t = 0;
        function tick() {
          t += 0.62;
          const o = t % 20;
          if (wf1) wf1.setAttribute('patternTransform', `rotate(21.4) translate(0 ${o.toFixed(2)})`);
          if (wf2) wf2.setAttribute('patternTransform', `rotate(7.1)  translate(0 ${o.toFixed(2)})`);
          if (wf3) wf3.setAttribute('patternTransform', `rotate(4.8)  translate(0 ${o.toFixed(2)})`);
          if (wf4) wf4.setAttribute('patternTransform', `rotate(14.0) translate(0 ${o.toFixed(2)})`);
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();

      // ── 船隻：由右往左，底部海面 ──
      (function () {
        const boat  = document.querySelector('[data-boat]');
        const baseY = 84.0;
        const speed = 0.055;
        const wAmp  = 0.28;
        const wFreq = 0.7;
        const maxRot = 1.2;
        let x = 102, last = null;
        function tick(ts) {
          if (!last) last = ts;
          const dt = Math.min((ts - last) / 1000, 0.1);
          last = ts;
          const t = ts / 1000;
          x -= speed * dt * 60;
          if (x < -12) x = 102;
          if (boat) {
            boat.style.left      = x + '%';
            boat.style.width     = '4%';
            boat.style.top       = (baseY + Math.sin(t * wFreq) * wAmp) + '%';
            boat.style.transform = `rotate(${(Math.sin(t * wFreq * 0.65 + 1) * maxRot).toFixed(2)}deg)`;
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
