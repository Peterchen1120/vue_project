<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Magic Islands Map Demo</title>
    <style>
      :root {
        --ink: #203044;
        --panel: #fff8e2;
        --panel-strong: #f4d384;
        --sea: #62cfd4;
        --focus: #fff1a6;
        --shadow: 0 18px 40px rgba(37, 69, 94, 0.24);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Trebuchet MS", "Noto Sans TC", sans-serif;
        background:
          radial-gradient(circle at 10% 8%, rgba(255, 246, 176, 0.78), transparent 18rem),
          linear-gradient(180deg, #a6edf1 0%, #5fcbd1 100%);
      }

      .demo-shell {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 24px;
      }

      .map-frame {
        position: relative;
        overflow: hidden;
        border: 10px solid rgba(255, 248, 226, 0.92);
        border-radius: 18px;
        background: var(--sea);
        box-shadow: var(--shadow);
        aspect-ratio: 1672 / 941;
      }

      .map-frame img,
      .mover-layer,
      .map-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .map-frame img {
        display: block;
        object-fit: cover;
      }

      .mover-layer {
        pointer-events: none;
        z-index: 2;
      }

      .map-layer {
        overflow: visible;
        z-index: 3;
      }

      .mover {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--w);
        transform-origin: center;
        filter: drop-shadow(0 7px 5px rgba(40, 87, 103, 0.2));
      }

      .mover--boat {
        animation: boat-drift var(--speed, 8s) ease-in-out infinite;
      }

      .mover--dolphins {
        animation: dolphin-glide var(--speed, 6s) ease-in-out infinite;
      }

      /* ── Hotspots ── */
      .hotspot { cursor: pointer; outline: none; }
      .hotspot path {
        fill: rgba(255, 245, 160, 0.02);
        stroke: transparent;
        stroke-width: 8;
        transition: fill 0.18s ease, stroke 0.18s ease, filter 0.18s ease;
      }
      .hotspot:hover path,
      .hotspot:focus path,
      .hotspot.is-active path {
        fill: rgba(255, 241, 166, 0.2);
        stroke: rgba(255, 241, 166, 0.96);
        filter: drop-shadow(0 0 14px rgba(255, 238, 126, 0.86));
      }

      /* ══════════════════════════════════════════
         WIND TURBINES
         Fix: transform-origin 50% 66.7% so the pivot
         lands on the hub (0,0) inside the fill-box.
         Bounding box: x[-50,50] y[-58,29] → height 87
         Hub y=0 → 58/87 ≈ 66.7% from top
      ══════════════════════════════════════════ */
      .turbine-blades {
        animation: spin 5s linear infinite;
        transform-box: fill-box;
        transform-origin: 50% 66.7%;
      }

      .blade-line {
        stroke: #fffefa;
        stroke-width: 9;
        stroke-linecap: round;
        filter: drop-shadow(0 2px 2px rgba(72, 103, 116, 0.32));
      }
      .blade-hub {
        fill: #fffefa;
        stroke: #dce8ea;
        stroke-width: 3;
      }

      /* ══════════════════════════════════════════
         SMOKE PUFFS
         圓形煙霧：每個噴口放 3 顆 circle，等差延遲
         形成連續上升流。transform-box + transform-origin
         讓 scale 以圓心為基點膨脹，不會飛出去。
      ══════════════════════════════════════════ */
      .smoke {
        opacity: 0;
        animation: smoke-rise 3.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
        filter: url(#smoke-blur);
      }
      .smoke.geo  { animation-duration: 3.8s; }
      .smoke.bio  { animation-duration: 3.1s; }
      .smoke.d1   { animation-delay: 1.13s; }
      .smoke.d2   { animation-delay: 2.27s; }

      /* ══════════════════════════════════════════
         WATER / HYDRO
         覆蓋式半透明流動 overlay：
         每條瀑布用 clipPath 框住區域，
         pattern 帶狀漸層往流向方向捲動，
         讓背景圖的瀑布看起來真的在流動。
      ══════════════════════════════════════════ */
      .ripple {
        fill: none;
        stroke: rgba(180, 245, 255, 0.7);
        stroke-width: 2.5;
      }

      /* ══════════════════════════════════════════
         SUN (Solar Isle)
         Replaced 3 floating circles with a proper
         sun disc + rotating rays element.
      ══════════════════════════════════════════ */
      .sun-disc {
        fill: #ffe066;
        animation: sun-disc-pulse 2.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .sun-halo {
        fill: rgba(255, 218, 60, 0.22);
        animation: sun-disc-pulse 2.6s ease-in-out infinite reverse;
        transform-box: fill-box;
        transform-origin: center;
      }
      .sun-rays-group {
        animation: sun-rays-rotate 14s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .sun-ray {
        stroke: #ffe566;
        stroke-linecap: round;
        opacity: 0.85;
      }

      /* Solar panel sparkle glints — 純 opacity，避免 SVG transform-box 相容問題 */
      .sparkle        { opacity: 0; animation: sparkle-appear 3.8s ease-in-out infinite; }
      .sparkle.s2     { animation-delay: -0.76s; }
      .sparkle.s3     { animation-delay: -1.52s; }
      .sparkle.s4     { animation-delay: -2.28s; }
      .sparkle.s5     { animation-delay: -3.04s; }
      @keyframes sparkle-appear {
        0%,  8%       { opacity: 0;    }
        20%, 35%      { opacity: 1;    }
        50%, 100%     { opacity: 0;    }
      }

      /* ══════════════════════════════════════════
         KEYFRAMES
      ══════════════════════════════════════════ */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Smoke puff: 從小圓膨脹並上升，以 fill-box 圓心縮放不飄移 */
      @keyframes smoke-rise {
        0%   { opacity: 0;    transform: translateY(0)     scale(0.35); }
        18%  { opacity: 0.75; }
        70%  { opacity: 0.42; }
        100% { opacity: 0;    transform: translateY(-62px) scale(2.2);  }
      }


      @keyframes sun-disc-pulse {
        0%, 100% { transform: scale(1);    opacity: 0.88; }
        50%      { transform: scale(1.1);  opacity: 1;    }
      }

      @keyframes sun-rays-rotate {
        to { transform: rotate(45deg); }
      }

      @keyframes boat-drift {
        0%, 100% { transform: translate3d(-8px, 4px, 0) rotate(-1.5deg); }
        50% { transform: translate3d(12px, -5px, 0) rotate(1.5deg); }
      }

      @keyframes dolphin-glide {
        0%, 100% { transform: translate3d(-10px, 5px, 0) rotate(-2deg); }
        42% { transform: translate3d(18px, -13px, 0) rotate(2deg); }
        68% { transform: translate3d(26px, -4px, 0) rotate(1deg); }
      }


      /* ── UI ── */
      .tooltip {
        position: absolute;
        left: var(--x, 50%);
        top: var(--y, 50%);
        translate: -50% -120%;
        pointer-events: none;
        padding: 9px 13px;
        border: 2px solid #7b4b21;
        border-radius: 999px;
        background: var(--panel);
        color: #422911;
        font-size: 0.9rem;
        font-weight: 900;
        box-shadow: 0 8px 18px rgba(72, 50, 28, 0.18);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.16s ease, transform 0.16s ease;
      }
      .tooltip.is-visible { opacity: 1; transform: translateY(0); }

      .control-dock {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        margin-top: 18px;
        padding: 16px;
        border: 3px solid rgba(123, 75, 33, 0.34);
        border-radius: 14px;
        background: rgba(255, 248, 226, 0.9);
        box-shadow: 0 10px 26px rgba(37, 69, 94, 0.14);
      }
      .info-panel h1 {
        margin: 0 0 4px;
        font-size: clamp(1.2rem, 2.2vw, 2rem);
        line-height: 1.1;
        color: #4b3218;
      }
      .info-panel p {
        margin: 0;
        color: #5f5140;
        font-size: 0.98rem;
        line-height: 1.55;
      }
      .energy-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .energy-button {
        min-width: 7.3rem;
        border: 2px solid #76502b;
        border-radius: 999px;
        padding: 10px 14px;
        background: #fff2b8;
        color: #43290f;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 900;
        cursor: pointer;
        transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      }
      .energy-button:hover,
      .energy-button:focus,
      .energy-button.is-active {
        background: #ffd45f;
        box-shadow: 0 7px 0 rgba(118, 80, 43, 0.28);
        transform: translateY(-4px);
        outline: none;
      }

      @media (max-width: 820px) {
        .demo-shell { padding: 12px; }
        .map-frame { border-width: 5px; border-radius: 12px; }
        .control-dock { grid-template-columns: 1fr; }
        .energy-buttons { justify-content: flex-start; }
        .energy-button { min-width: auto; flex: 1 1 8rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <section class="map-frame" aria-label="Energy Magic Islands interactive map">
        <img src="./energy-map-clean-no-movers.png" alt="Energy Magic Islands clean map" />

        <!-- mover-layer 暫時註解
        <div class="mover-layer" aria-hidden="true">
          <img
            class="mover mover--dolphins"
            src="./movers/dolphins-center.png"
            style="--x: 45.1%; --y: 40.9%; --w: 11.2%; --speed: 6.2s"
            alt=""
          />
          <img
            class="mover mover--dolphins"
            src="./movers/dolphins-southwest.png"
            style="--x: 17.6%; --y: 81.2%; --w: 14.4%; --speed: 7.4s"
            alt=""
          />
          <img
            class="mover mover--boat"
            src="./movers/sailboat-west.png"
            style="--x: 6.7%; --y: 42.3%; --w: 5.1%; --speed: 8.5s"
            alt=""
          />
          <img
            class="mover mover--boat"
            src="./movers/ship-central.png"
            style="--x: 32.5%; --y: 47.4%; --w: 8.6%; --speed: 9s"
            alt=""
          />
          <img
            class="mover mover--boat"
            src="./movers/sailboat-east.png"
            style="--x: 60.2%; --y: 54.1%; --w: 6.8%; --speed: 8.2s"
            alt=""
          />
          <img
            class="mover mover--boat"
            src="./movers/sailboat-solar.png"
            style="--x: 57.2%; --y: 42.6%; --w: 5.4%; --speed: 7.6s"
            alt=""
          />
        </div>
        -->

        <svg class="map-layer" viewBox="0 0 1672 941" role="img" aria-label="Animated energy map overlays">
          <defs>
            <!-- Blade set: hub at (0,0), blades extend outward -->
            <g id="blade-set">
              <line class="blade-line" x1="0" y1="0" x2="0"   y2="-58" />
              <line class="blade-line" x1="0" y1="0" x2="50"  y2="29"  />
              <line class="blade-line" x1="0" y1="0" x2="-50" y2="29"  />
              <circle class="blade-hub" cx="0" cy="0" r="10" />
            </g>
            <!-- Waterfall edge softening -->
            <filter id="wf-blur" x="-30%" y="-10%" width="160%" height="120%">
              <feGaussianBlur stdDeviation="1.2"/>
            </filter>

            <!-- ── 瀑布 ClipPath：依像素分析所得邊緣輪廓 ──
                 WF1: 左瀑布  斜率 −0.31px/row → 每30px下移 −9.4px
                 WF2: 中左瀑布 斜率 −0.10px/row → 每30px下移 −3.0px
                 WF3: 中右瀑布 斜率 −0.07px/row → 每30px下移 −2.0px
                 WF4: 右瀑布  斜率 −0.20px/row → 每30px下移 −6.0px
            ──────────────────────────────────────────────── -->
            <clipPath id="wf1-clip">
              <polygon points="816,245 841,245 825,300 800,300"/>
            </clipPath>
            <clipPath id="wf2-clip">
              <polygon points="930,200 974,200 973,295 918,295"/>
            </clipPath>
            <clipPath id="wf3-clip">
              <polygon points="987,232 1016,232 1016,295 977,295"/>
            </clipPath>
            <clipPath id="wf4-clip">
              <polygon points="1078,250 1114,250 1104,300 1068,300"/>
            </clipPath>

            <!-- 帶狀漸層 pattern：淡藍-白光帶-深藍交替，由JS控制 patternTransform 捲動 -->
            <pattern id="wf1-pat" x="0" y="0" width="80" height="30" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="9"  fill="rgba(170,225,252,0.52)"/>
              <rect y="9"  width="80" height="4"  fill="rgba(255,255,255,0.82)"/>
              <rect y="13" width="80" height="9"  fill="rgba(140,205,245,0.38)"/>
              <rect y="22" width="80" height="8"  fill="rgba(180,230,255,0.20)"/>
            </pattern>
            <pattern id="wf2-pat" x="0" y="0" width="80" height="30" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="9"  fill="rgba(170,225,252,0.52)"/>
              <rect y="9"  width="80" height="4"  fill="rgba(255,255,255,0.82)"/>
              <rect y="13" width="80" height="9"  fill="rgba(140,205,245,0.38)"/>
              <rect y="22" width="80" height="8"  fill="rgba(180,230,255,0.20)"/>
            </pattern>
            <pattern id="wf3-pat" x="0" y="0" width="80" height="30" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="9"  fill="rgba(170,225,252,0.52)"/>
              <rect y="9"  width="80" height="4"  fill="rgba(255,255,255,0.82)"/>
              <rect y="13" width="80" height="9"  fill="rgba(140,205,245,0.38)"/>
              <rect y="22" width="80" height="8"  fill="rgba(180,230,255,0.20)"/>
            </pattern>
            <pattern id="wf4-pat" x="0" y="0" width="80" height="30" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="9"  fill="rgba(170,225,252,0.52)"/>
              <rect y="9"  width="80" height="4"  fill="rgba(255,255,255,0.82)"/>
              <rect y="13" width="80" height="9"  fill="rgba(140,205,245,0.38)"/>
              <rect y="22" width="80" height="8"  fill="rgba(180,230,255,0.20)"/>
            </pattern>
            <!-- Smoke blur -->
            <filter id="smoke-blur" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="4" />
            </filter>
          </defs>

          <g aria-hidden="true">

            <!-- ── WIND: 5 turbines ── -->
            <!-- 外層 g：純 SVG 屬性定位（不碰 CSS transform）
                 內層 g：純 CSS animation 旋轉（無 SVG transform 屬性）
                 兩層分開才能正確疊加，不會互相覆蓋               -->
            <g transform="translate(391,118)">
              <g class="turbine-blades"><use href="#blade-set" /></g>
            </g>
            <g transform="translate(505,198)">
              <g class="turbine-blades" style="animation-duration:4.6s"><use href="#blade-set" /></g>
            </g>
            <g transform="translate(590,288) scale(0.78)">
              <g class="turbine-blades" style="animation-duration:5.4s"><use href="#blade-set" /></g>
            </g>
            <g transform="translate(324,165) scale(0.58)">
              <g class="turbine-blades" style="animation-duration:6.0s"><use href="#blade-set" /></g>
            </g>
            <g transform="translate(456,162) scale(0.54)">
              <g class="turbine-blades" style="animation-duration:5.8s"><use href="#blade-set" /></g>
            </g>

            <!-- ── HYDRO: 覆蓋式瀑布流動 overlay（4 道水流）── -->

            <!-- WF1: 左瀑布（往左下 −9.4px/30px） -->
            <g clip-path="url(#wf1-clip)" filter="url(#wf-blur)">
              <rect x="794" y="243" width="52" height="90"
                    fill="url(#wf1-pat)" opacity="0.92"/>
            </g>

            <!-- WF2: 中左瀑布（微斜 −3px/30px） -->
            <g clip-path="url(#wf2-clip)" filter="url(#wf-blur)">
              <rect x="916" y="198" width="62" height="130"
                    fill="url(#wf2-pat)" opacity="0.92"/>
            </g>

            <!-- WF3: 中右瀑布（近垂直 −2px/30px） -->
            <g clip-path="url(#wf3-clip)" filter="url(#wf-blur)">
              <rect x="975" y="230" width="44" height="100"
                    fill="url(#wf3-pat)" opacity="0.92"/>
            </g>

            <!-- WF4: 右瀑布（斜左 −6px/30px） -->
            <g clip-path="url(#wf4-clip)" filter="url(#wf-blur)">
              <rect x="1062" y="248" width="56" height="85"
                    fill="url(#wf4-pat)" opacity="0.92"/>
            </g>

            <!-- 湖面漣漪：對應 4 條瀑布落水點 -->
            <circle class="ripple" cx="812" cy="322" r="6"><animate attributeName="r" from="6" to="26" dur="2.1s" begin="0s"    repeatCount="indefinite"/><animate attributeName="opacity" from="0.7" to="0" dur="2.1s" begin="0s"    repeatCount="indefinite"/></circle>
            <circle class="ripple" cx="946" cy="318" r="6"><animate attributeName="r" from="6" to="32" dur="2.0s" begin="0.5s"  repeatCount="indefinite"/><animate attributeName="opacity" from="0.7" to="0" dur="2.0s" begin="0.5s"  repeatCount="indefinite"/></circle>
            <circle class="ripple" cx="996" cy="318" r="5"><animate attributeName="r" from="5" to="28" dur="1.9s" begin="1.0s"  repeatCount="indefinite"/><animate attributeName="opacity" from="0.65" to="0" dur="1.9s" begin="1.0s" repeatCount="indefinite"/></circle>
            <circle class="ripple" cx="1086" cy="322" r="5"><animate attributeName="r" from="5" to="24" dur="2.3s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.65" to="0" dur="2.3s" begin="0.3s" repeatCount="indefinite"/></circle>

            <!-- ── SOLAR: animated sun above Solar Isle ── -->
            <!-- Sun positioned at (1310, 240) — shifted left+down to avoid island label -->
            <g transform="translate(1310,240)">
              <!-- outer halo -->
              <circle class="sun-halo" r="42" />
              <!-- rays — 8 spokes, rotate slowly -->
              <g class="sun-rays-group">
                <line class="sun-ray" x1="0" y1="-32" x2="0"   y2="-52" stroke-width="5" />
                <line class="sun-ray" x1="23" y1="-23" x2="37" y2="-37" stroke-width="4" />
                <line class="sun-ray" x1="32" y1="0"   x2="52" y2="0"   stroke-width="5" />
                <line class="sun-ray" x1="23" y1="23"  x2="37" y2="37"  stroke-width="4" />
                <line class="sun-ray" x1="0"  y1="32"  x2="0"  y2="52"  stroke-width="5" />
                <line class="sun-ray" x1="-23" y1="23" x2="-37" y2="37" stroke-width="4" />
                <line class="sun-ray" x1="-32" y1="0"  x2="-52" y2="0"  stroke-width="5" />
                <line class="sun-ray" x1="-23" y1="-23" x2="-37" y2="-37" stroke-width="4" />
              </g>
              <!-- disc on top -->
              <circle class="sun-disc" r="26" />
            </g>

            <!-- Solar panel sparkle glints：5 顆 4 芒星，錯開時間輪流閃 -->
            <!-- 每顆 sparkle：十字主芒（白）+ 斜芒（淡黃）+ 中心亮點 -->
            <g class="sparkle s1" transform="translate(1368,388)">
              <line x1="0" y1="-9" x2="0" y2="9" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="-9" y1="0" x2="9" y2="0" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="-5" y1="-5" x2="5" y2="5" stroke="rgba(255,252,200,0.72)" stroke-width="1.1" stroke-linecap="round"/>
              <line x1="-5" y1="5" x2="5" y2="-5" stroke="rgba(255,252,200,0.72)" stroke-width="1.1" stroke-linecap="round"/>
              <circle r="2.2" fill="white"/>
            </g>
            <g class="sparkle s2" transform="translate(1450,372)">
              <line x1="0" y1="-7" x2="0" y2="7" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
              <line x1="-7" y1="0" x2="7" y2="0" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
              <line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,252,200,0.65)" stroke-width="1" stroke-linecap="round"/>
              <line x1="-4" y1="4" x2="4" y2="-4" stroke="rgba(255,252,200,0.65)" stroke-width="1" stroke-linecap="round"/>
              <circle r="1.8" fill="white"/>
            </g>
            <g class="sparkle s3" transform="translate(1500,400)">
              <line x1="0" y1="-8" x2="0" y2="8" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
              <line x1="-8" y1="0" x2="8" y2="0" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
              <line x1="-5" y1="-5" x2="5" y2="5" stroke="rgba(255,252,200,0.68)" stroke-width="1" stroke-linecap="round"/>
              <line x1="-5" y1="5" x2="5" y2="-5" stroke="rgba(255,252,200,0.68)" stroke-width="1" stroke-linecap="round"/>
              <circle r="2" fill="white"/>
            </g>

    <script>
      const energyCopy = {
        wind:       { title: "Wind Isle",       label: "Wind Isle",       description: "風力島：五座風機葉片持續旋轉，轉軸對齊輪轂中心。",              x: "27%", y: "27%" },
        hydro:      { title: "Hydro Isle",      label: "Hydro Isle",      description: "水力島：三道水流沿瀑布向下流動，湖面有波紋擴散。",             x: "57%", y: "27%" },
        solar:      { title: "Solar Isle",      label: "Solar Isle",      description: "太陽能島：天空有旋轉光芒的太陽，島上有三個太陽能板閃爍。",     x: "84%", y: "43%" },
        nuclear:    { title: "Nuclear Isle",    label: "Nuclear Isle",    description: "核能島：三根冷卻塔持續噴出蒸氣，平滑上升不再有抖動。",         x: "22%", y: "61%" },
        biomass:    { title: "Biomass Isle",    label: "Biomass Isle",    description: "生質能島：煙囪煙霧緩緩上升，兩道煙各有不同節奏。",             x: "47%", y: "74%" },
        geothermal: { title: "Geothermal Isle", label: "Geothermal Isle", description: "地熱島：三處地熱噴口蒸氣各自錯開時序，循環上升。",             x: "80%", y: "75%" },
      };

      const tooltip    = document.querySelector("#tooltip");
      const titleEl    = document.querySelector("#energyTitle");
      const descEl     = document.querySelector("#energyDescription");
      const items      = document.querySelectorAll("[data-energy]");

      function setActive(type) {
        const item = energyCopy[type];
        if (!item) return;
        titleEl.textContent       = item.title;
        descEl.textContent        = item.description;
        tooltip.textContent       = item.label;
        tooltip.style.setProperty("--x", item.x);
        tooltip.style.setProperty("--y", item.y);
        tooltip.classList.add("is-visible");
        items.forEach(n => n.classList.toggle("is-active", n.dataset.energy === type));
      }

      items.forEach(node => {
        node.addEventListener("click",     () => setActive(node.dataset.energy));
        node.addEventListener("mouseenter",() => setActive(node.dataset.energy));
        node.addEventListener("focus",     () => setActive(node.dataset.energy));
        node.addEventListener("keydown",   e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setActive(node.dataset.energy); }
        });
      });

      setActive("wind");

      // ── 瀑布流動動畫 ──
      // 4 道水流，各自依 PIL 像素分析所得斜率捲動 patternTransform
      // WF1 (左)：  avg slope −0.312 → per 30px: x=−9.4
      // WF2 (中左)：avg slope −0.100 → per 30px: x=−3.0
      // WF3 (中右)：avg slope −0.067 → per 30px: x=−2.0
      // WF4 (右)：  avg slope −0.200 → per 30px: x=−6.0
      (function () {
        const wf1 = document.getElementById('wf1-pat');
        const wf2 = document.getElementById('wf2-pat');
        const wf3 = document.getElementById('wf3-pat');
        const wf4 = document.getElementById('wf4-pat');
        let t = 0;
        function tick() {
          t += 0.55;
          const o = t % 30;
          if (wf1) wf1.setAttribute('patternTransform',
            `translate(${(-(o * 9.4 / 30)).toFixed(2)} ${o.toFixed(2)})`);
          if (wf2) wf2.setAttribute('patternTransform',
            `translate(${(-(o * 3.0 / 30)).toFixed(2)} ${o.toFixed(2)})`);
          if (wf3) wf3.setAttribute('patternTransform',
            `translate(${(-(o * 2.0 / 30)).toFixed(2)} ${o.toFixed(2)})`);
          if (wf4) wf4.setAttribute('patternTransform',
            `translate(${(-(o * 6.0 / 30)).toFixed(2)} ${o.toFixed(2)})`);
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
