<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Magic Islands Map Demo</title>
    <style>
      :root {
        --ink: #203044;
        --panel: #fff8e2;
        --panel-strong: #f4d384;
        --sea: #62cfd4;
        --focus: #fff1a6;
        --shadow: 0 18px 40px rgba(37, 69, 94, 0.24);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Trebuchet MS", "Noto Sans TC", sans-serif;
        background:
          radial-gradient(circle at 10% 8%, rgba(255, 246, 176, 0.78), transparent 18rem),
          linear-gradient(180deg, #a6edf1 0%, #5fcbd1 100%);
      }

      .demo-shell {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 24px;
      }

      .map-frame {
        position: relative;
        overflow: hidden;
        border: 10px solid rgba(255, 248, 226, 0.92);
        border-radius: 18px;
        background: var(--sea);
        box-shadow: var(--shadow);
        aspect-ratio: 1672 / 941;
      }

      /* ?芸?????湔摮?蝝?憟?冽遛摰?嚗over ??img 銝?敶梢 */
      /* direct-child only, 避免蓋掉 mover img */
      .map-frame > img,
      .map-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .map-frame > img {
        display: block;
        object-fit: cover;
      }

      .map-layer { overflow: visible; }

      /* ── mover 層 ── */
      .mover-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .mover-layer img {
        position: absolute;
        inset: unset;
        width: var(--w, 8%);
        height: auto;
        left: var(--x, 0);
        top:  var(--y, 0);
      }

      /* ── 海豚動畫：拋物線圓弧，linear 計時確保流暢 ── */
      .mover--dolphin-jump {
        animation: dolphin-jump var(--speed, 9s) linear infinite;
      }
      .mover--dolphin-jump-left {
        animation: dolphin-jump-left var(--speed, 9s) linear infinite;
        animation-delay: var(--delay, 0s);
      }
      @keyframes dolphin-jump {
        /* 由左往右：出水鼻朝上（負角）→ 頂點水平 → 入水鼻朝下（正角）*/
        0%        { transform: translate(  0px,  14px) rotate(-28deg); opacity: 0;   }
        1%        { transform: translate(  4px,   5px) rotate(-20deg); opacity: 1;   }
        4%        { transform: translate( 14px,  -6px) rotate(-11deg); opacity: 1;   }
        7%        { transform: translate( 26px, -16px) rotate( -3deg); opacity: 1;   }
        9%        { transform: translate( 34px, -20px) rotate(  0deg); opacity: 1;   }
        12%       { transform: translate( 46px, -15px) rotate( 20deg); opacity: 1;   }
        15%       { transform: translate( 58px,  -3px) rotate( 42deg); opacity: 1;   }
        17%       { transform: translate( 66px,   5px) rotate( 58deg); opacity: 0.5; }
        18%       { transform: translate( 70px,  14px) rotate( 70deg); opacity: 0;   }
        19%, 100% { transform: translate(  0px,  14px) rotate(-28deg); opacity: 0;   }
      }
      @keyframes dolphin-jump-left {
        /* scaleX(-1) 鏡射：x/rotation 值和 dolphin-jump 相同，視覺上完全對稱 */
        0%        { transform: scaleX(-1) translate(  0px,  14px) rotate(-28deg); opacity: 0;   }
        1%        { transform: scaleX(-1) translate(  4px,   5px) rotate(-20deg); opacity: 1;   }
        4%        { transform: scaleX(-1) translate( 14px,  -6px) rotate(-11deg); opacity: 1;   }
        7%        { transform: scaleX(-1) translate( 26px, -16px) rotate( -3deg); opacity: 1;   }
        9%        { transform: scaleX(-1) translate( 34px, -20px) rotate(  0deg); opacity: 1;   }
        12%       { transform: scaleX(-1) translate( 46px, -15px) rotate( 20deg); opacity: 1;   }
        15%       { transform: scaleX(-1) translate( 58px,  -3px) rotate( 42deg); opacity: 1;   }
        17%       { transform: scaleX(-1) translate( 66px,   5px) rotate( 58deg); opacity: 0.5; }
        18%       { transform: scaleX(-1) translate( 70px,  14px) rotate( 70deg); opacity: 0;   }
        19%, 100% { transform: scaleX(-1) translate(  0px,  14px) rotate(-28deg); opacity: 0;   }
      }

      /* ?? Hotspots ?? */
      .hotspot { cursor: pointer; outline: none; }
      .hotspot path {
        fill: rgba(255, 245, 160, 0.02);
        stroke: transparent;
        stroke-width: 8;
        transition: fill 0.18s ease, stroke 0.18s ease, filter 0.18s ease;
      }
      .hotspot:hover path,
      .hotspot:focus path,
      .hotspot.is-active path {
        fill: rgba(200, 235, 255, 0.15);
        stroke: none;
        filter: drop-shadow(0 0 18px rgba(180, 230, 255, 0.75)) drop-shadow(0 0 6px rgba(255,255,255,0.5));
      }

      /* ??????????????????????????????????????????
         WIND TURBINES
         Fix: transform-origin 50% 66.7% so the pivot
         lands on the hub (0,0) inside the fill-box.
         Bounding box: x[-50,50] y[-58,29] ??height 87
         Hub y=0 ??58/87 ??66.7% from top
      ?????????????????????????????????????????? */
      /* turbine-blades: rotation handled by SVG animateTransform */

      .blade-line {
        stroke: #fffefa;
        stroke-width: 9;
        stroke-linecap: round;
        filter: drop-shadow(0 2px 2px rgba(72, 103, 116, 0.32));
      }
      .blade-hub {
        fill: #fffefa;
        stroke: #dce8ea;
        stroke-width: 3;
      }

      /* ??????????????????????????????????????????
         SMOKE PUFFS
         ?耦?嚗???? 3 憿?circle嚗?撌桀辣??         敶Ｘ????銝?瘚ransform-box + transform-origin
         霈?scale 隞亙?敹?粹??刻嚗????箏??      ?????????????????????????????????????????? */
      .smoke {
        opacity: 0;
        animation: smoke-rise 3.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
        filter: url(#smoke-blur);
      }
      .smoke.geo  { animation-duration: 3.8s; }
      .smoke.bio  { animation-duration: 3.1s; }
      .smoke.d1   { animation-delay: 1.13s; }
      .smoke.d2   { animation-delay: 2.27s; }

      /* ??????????????????????????????????????????
         WATER / HYDRO
         閬?撘???瘚? overlay嚗?         瘥?????clipPath 獢????
         pattern 撣嗥?瞍詨惜敺瘚??孵??脣?嚗?         霈??臬????絲靘??瘚???      ?????????????????????????????????????????? */
      .ripple {
        fill: none;
        stroke: rgba(180, 245, 255, 0.7);
        stroke-width: 2.5;
      }

      /* ??????????????????????????????????????????
         SUN (Solar Isle)
         Replaced 3 floating circles with a proper
         sun disc + rotating rays element.
      ?????????????????????????????????????????? */
      .sun-disc {
        fill: #ffe066;
        animation: sun-disc-pulse 2.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .sun-halo {
        fill: rgba(255, 218, 60, 0.22);
        animation: sun-disc-pulse 2.6s ease-in-out infinite reverse;
        transform-box: fill-box;
        transform-origin: center;
      }
      .sun-rays-group {
        animation: sun-rays-rotate 14s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .sun-ray {
        stroke: #ffe566;
        stroke-linecap: round;
        opacity: 0.85;
      }

      /* Solar panel sparkle glints ??蝝?opacity嚗??SVG transform-box ?詨捆?? */
      .sparkle        { opacity: 0; animation: sparkle-appear 3.8s ease-in-out infinite; }
      .sparkle.s2     { animation-delay: -0.76s; }
      .sparkle.s3     { animation-delay: -1.52s; }
      .sparkle.s4     { animation-delay: -2.28s; }
      .sparkle.s5     { animation-delay: -3.04s; }
      @keyframes sparkle-appear {
        0%,  8%       { opacity: 0;    }
        20%, 35%      { opacity: 1;    }
        50%, 100%     { opacity: 0;    }
      }

      /* ??????????????????????????????????????????
         KEYFRAMES
      ?????????????????????????????????????????? */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Smoke puff: 敺???嫣蒂銝?嚗誑 fill-box ??蝮格銝?蝘?*/
      @keyframes smoke-rise {
        0%   { opacity: 0;    transform: translateY(0)     scale(0.35); }
        18%  { opacity: 0.75; }
        70%  { opacity: 0.42; }
        100% { opacity: 0;    transform: translateY(-62px) scale(2.2);  }
      }


      @keyframes sun-disc-pulse {
        0%, 100% { transform: scale(1);    opacity: 0.88; }
        50%      { transform: scale(1.1);  opacity: 1;    }
      }

      @keyframes sun-rays-rotate {
        to { transform: rotate(45deg); }
      }

      /* ── Ocean glints ── */
      .ocean-glint {
        animation: ocean-glint 4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .og2  { animation-delay: -0.55s; }
      .og3  { animation-delay: -1.1s;  }
      .og4  { animation-delay: -1.65s; }
      .og5  { animation-delay: -2.2s;  }
      .og6  { animation-delay: -2.75s; }
      .og7  { animation-delay: -3.3s;  }
      .og8  { animation-delay: -0.28s; }
      .og9  { animation-delay: -0.83s; }
      .og10 { animation-delay: -1.38s; }
      .og11 { animation-delay: -1.93s; }
      .og12 { animation-delay: -2.48s; }
      .og13 { animation-delay: -3.03s; }
      .og14 { animation-delay: -3.58s; }
      .og15 { animation-delay: -0.42s; }
      @keyframes ocean-glint {
        0%, 100% { opacity: 0;    transform: scale(0.4); }
        40%, 60% { opacity: 0.82; transform: scale(1);   }
      }

      /* ?? UI ?? */
      .tooltip {
        position: fixed;
        pointer-events: none;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(20, 30, 48, 0.82);
        color: #e8f4ff;
        font-size: 0.82rem;
        font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
        font-weight: 500;
        letter-spacing: 0.06em;
        backdrop-filter: blur(6px);
        box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.14s ease, transform 0.14s ease;
        white-space: nowrap;
      }
      .tooltip.is-visible { opacity: 1; transform: translateY(0); }

      .control-dock {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        margin-top: 18px;
        padding: 16px;
        border: 3px solid rgba(123, 75, 33, 0.34);
        border-radius: 14px;
        background: rgba(255, 248, 226, 0.9);
        box-shadow: 0 10px 26px rgba(37, 69, 94, 0.14);
      }
      .info-panel h1 {
        margin: 0 0 4px;
        font-size: clamp(1.2rem, 2.2vw, 2rem);
        line-height: 1.1;
        color: #4b3218;
      }
      .info-panel p {
        margin: 0;
        color: #5f5140;
        font-size: 0.98rem;
        line-height: 1.55;
      }
      .energy-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .energy-button {
        min-width: 7.3rem;
        border: 2px solid #76502b;
        border-radius: 999px;
        padding: 10px 14px;
        background: #fff2b8;
        color: #43290f;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 900;
        cursor: pointer;
        transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      }
      .energy-button:hover,
      .energy-button:focus,
      .energy-button.is-active {
        background: #ffd45f;
        box-shadow: 0 7px 0 rgba(118, 80, 43, 0.28);
        transform: translateY(-4px);
        outline: none;
      }

      @media (max-width: 820px) {
        .demo-shell { padding: 12px; }
        .map-frame { border-width: 5px; border-radius: 12px; }
        .control-dock { grid-template-columns: 1fr; }
        .energy-buttons { justify-content: flex-start; }
        .energy-button { min-width: auto; flex: 1 1 8rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <section class="map-frame" aria-label="Energy Magic Islands interactive map">
        <img src="./energy-map-clean-no-text-compass-no-movers.png" alt="Energy Magic Islands clean map" />

        <svg class="map-layer" viewBox="0 0 1672 941" role="img" aria-label="Animated energy map overlays">
          <defs>
            <!-- Blade set: hub at (0,0), blades extend outward -->
            <g id="blade-set">
              <line class="blade-line" x1="0" y1="0" x2="0"   y2="-58" />
              <line class="blade-line" x1="0" y1="0" x2="50"  y2="29"  />
              <line class="blade-line" x1="0" y1="0" x2="-50" y2="29"  />
              <circle class="blade-hub" cx="0" cy="0" r="10" />
            </g>
            <!-- Waterfall edge softening -->
            <filter id="wf-blur" x="-30%" y="-10%" width="160%" height="120%">
              <feGaussianBlur stdDeviation="1.2"/>
            </filter>

            <!-- ?? ?? ClipPath嚗???????蝎曄Ⅱ鞎澆?瘞湔??? ??
                 WF1: 撌血瘞湧?  y=244-281嚗蝺????嗆?
                 WF2: 銝剖椰?  y=214-280嚗?◤????x=970
                 WF3: 銝剖?  y=230-290嚗椰?????x=981 韏?                 WF4: ?喳瘞湧?  y=270-300嚗?畾?y=248-256 ?函???嚗?            ???????????????????????????????????????????????? -->
            <clipPath id="wf1-clip">
              <polygon points="826,244 848,244 836,281 813,281"/>
            </clipPath>
            <clipPath id="wf2-clip">
              <polygon points="936,214 970,214 970,280 921,280"/>
            </clipPath>
            <clipPath id="wf3-clip">
              <polygon points="991,230 1019,230 1007,290 985,290"/>
            </clipPath>
            <clipPath id="wf4-clip">
              <polygon points="1086,270 1106,270 1100,300 1070,300"/>
            </clipPath>

            <!-- ??撣嗥? pattern嚗 JS ??撠???瘚?敺??脣?嚗?                 瘞游像撣嗅 patternTransform rotate 敺停??朣??????湔???-->
            <pattern id="wf1-pat" x="0" y="0" width="80" height="20" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="6"  fill="rgba(186,232,255,0.48)"/>
              <rect y="6"  width="80" height="3"  fill="rgba(255,255,255,0.75)"/>
              <rect y="9"  width="80" height="5"  fill="rgba(148,210,245,0.32)"/>
              <rect y="14" width="80" height="6"  fill="rgba(186,230,255,0.10)"/>
            </pattern>
            <pattern id="wf2-pat" x="0" y="0" width="80" height="20" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="6"  fill="rgba(186,232,255,0.48)"/>
              <rect y="6"  width="80" height="3"  fill="rgba(255,255,255,0.75)"/>
              <rect y="9"  width="80" height="5"  fill="rgba(148,210,245,0.32)"/>
              <rect y="14" width="80" height="6"  fill="rgba(186,230,255,0.10)"/>
            </pattern>
            <pattern id="wf3-pat" x="0" y="0" width="80" height="20" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="6"  fill="rgba(186,232,255,0.48)"/>
              <rect y="6"  width="80" height="3"  fill="rgba(255,255,255,0.75)"/>
              <rect y="9"  width="80" height="5"  fill="rgba(148,210,245,0.32)"/>
              <rect y="14" width="80" height="6"  fill="rgba(186,230,255,0.10)"/>
            </pattern>
            <pattern id="wf4-pat" x="0" y="0" width="80" height="20" patternUnits="userSpaceOnUse">
              <rect y="0"  width="80" height="6"  fill="rgba(186,232,255,0.48)"/>
              <rect y="6"  width="80" height="3"  fill="rgba(255,255,255,0.75)"/>
              <rect y="9"  width="80" height="5"  fill="rgba(148,210,245,0.32)"/>
              <rect y="14" width="80" height="6"  fill="rgba(186,230,255,0.10)"/>
            </pattern>
            <!-- Smoke blur -->
            <filter id="smoke-blur" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="4" />
            </filter>
          </defs>

          <g aria-hidden="true">


            <!-- ══ OCEAN ANIMATION ══════════════════════════════════════ -->
            <line x1="42" y1="852" x2="104" y2="852" stroke="rgba(255,255,255,0.72)" stroke-width="2.8" stroke-linecap="round">
              <animateTransform attributeName="transform" type="translate" from="0,0" to="28,0" dur="2.4s" begin="-0.0s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0;0.72;0.50;0" keyTimes="0;0.2;0.78;1" dur="2.4s" begin="-0.0s" repeatCount="indefinite"/>
            </line>
            <line x1="165" y1="866" x2="213" y2="866" stroke="rgba(255,255,255,0.65)" stroke-width="2.2" stroke-linecap="round">
              <animateTransform attributeName="transform" type="translate" from="0,0" to="28,0" dur="2.8s" begin="-0.42s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0;0.65;0.45;0" keyTimes="0;0.2;0.78;1" dur="2.8s" begin="-0.42s" repeatCount="indefinite"/>
            </line>
            <line x1="298" y1="850" x2="368" y2="850" stroke="rgba(255,255,255,0.78)" stroke-width="3.0" stroke-linecap="round">
              <animateTransform attributeName="transform" type="translate" from="0,0" to="28,0" dur="2.2s" begin="-0.84s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0;0.78;0.55;0" keyTimes="0;0.2;0.78;1" dur="2.2s" begin="-0.84s" repeatCount="indefinite"/>
            </line>
            <line x1="455" y1="874" x2="510" y2="874" stroke="rgba(255,255,255,0.68)" stroke-width="2.5" stroke-linecap="round">
              <animateTransform attributeName="transform" type="translate" from="0,0" to="28,0" dur="2.6s" begin="-1.26s" repeatCount="indefinite"/>

    <script>
      const energyCopy = {
        wind:       { title: "風力島",   label: "風力島",   description: "風力發電利用自然風能產生清潔電力。",           x: "27%", y: "27%" },
        hydro:      { title: "水力島",   label: "水力島",   description: "水力發電將流水動能轉換為可再生能源。",           x: "57%", y: "27%" },
        solar:      { title: "太陽能島", label: "太陽能島", description: "太陽能板捕捉陽光並將其轉化為電能。",             x: "84%", y: "43%" },
        nuclear:    { title: "核能島",   label: "核能島",   description: "核分裂釋放巨大能量，且不產生碳排放。",           x: "22%", y: "61%" },
        biomass:    { title: "生質能島", label: "生質能島", description: "生質能將有機材料轉化為可用燃料與電力。",           x: "47%", y: "74%" },
        geothermal: { title: "地熱島",   label: "地熱島",   description: "地熱能利用地球深處的熱能發電。",               x: "80%", y: "75%" },
      };

      const tooltip    = document.querySelector("#tooltip");
      const titleEl    = document.querySelector("#energyTitle");
      const descEl     = document.querySelector("#energyDescription");
      const items      = document.querySelectorAll("[data-energy]");

      function setActive(type) {
        const item = energyCopy[type];
        if (!item) return;
        titleEl.textContent  = item.title;
        descEl.textContent   = item.description;
        tooltip.textContent  = item.label;
        items.forEach(n => n.classList.toggle("is-active", n.dataset.energy === type));
      }

      function showTooltip(e, type) {
        const item = energyCopy[type];
        if (!item) return;
        tooltip.textContent = item.label;
        tooltip.classList.add("is-visible");
        moveTooltip(e);
      }

      function moveTooltip(e) {
        const x = e.clientX + 14;
        const y = e.clientY - 32;
        tooltip.style.left = x + "px";
        tooltip.style.top  = y + "px";
      }

      function hideTooltip() {
        tooltip.classList.remove("is-visible");
      }

      items.forEach(node => {
        node.addEventListener("click",      () => setActive(node.dataset.energy));
        node.addEventListener("mouseenter", e  => showTooltip(e, node.dataset.energy));
        node.addEventListener("mousemove",  e  => moveTooltip(e));
        node.addEventListener("mouseleave", ()  => hideTooltip());
        node.addEventListener("focus",      ()  => setActive(node.dataset.energy));
        node.addEventListener("keydown",    e  => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setActive(node.dataset.energy); }
        });
      });

      // ── 瀑布流動 ──
      (function () {
        const wf1 = document.getElementById('wf1-pat');
        const wf2 = document.getElementById('wf2-pat');
        const wf3 = document.getElementById('wf3-pat');
        const wf4 = document.getElementById('wf4-pat');
        let t = 0;
        function tick() {
          t += 0.62;
          const o = t % 20;
          if (wf1) wf1.setAttribute('patternTransform', `rotate(21.4) translate(0 ${o.toFixed(2)})`);
          if (wf2) wf2.setAttribute('patternTransform', `rotate(7.1)  translate(0 ${o.toFixed(2)})`);
          if (wf3) wf3.setAttribute('patternTransform', `rotate(4.8)  translate(0 ${o.toFixed(2)})`);
          if (wf4) wf4.setAttribute('patternTransform', `rotate(14.0) translate(0 ${o.toFixed(2)})`);
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();

      // ── 中央大船：由左往右，兩段路徑 ──
      // 規則：船上半可碰Wind島，船下半(top+7%)不可碰Nuclear島(頂~50%)
      // 段1 (x=-10~30): flat y=40%  → 底半=47%，Nuclear頂50% ✓
      // 段2 (x=30~112): y = 40 + 0.20*(x-30)，緩緩下移穿越中央海域
      (function () {
        const boat = document.querySelector('[data-boat-center]');
        function getY(x) {
          return x < 30 ? 40 : 40 + 0.20 * (x - 30);
        }
        const x0 = -10, speed = 0.032, wAmp = 0.12, wFreq = 0.38, maxRot = 0.8;
        let x = x0, last = null, frame = 0;
        function tick(ts) {
          if (!last) last = ts;
          const dt = Math.min((ts - last) / 1000, 0.1);
          last = ts; frame++;
          const t = ts / 1000;
          x += speed * dt * 60;
          if (x > 112) x = x0;
          const y = getY(x);
          const rock = Math.sin(t * wFreq * 0.6 + 0.8) * maxRot;
          const angle = x < 30 ? (-1.5 + rock) : (2 + rock);
          if (boat) {
            boat.style.left      = x + '%';
            boat.style.top       = (y + Math.sin(t * wFreq) * wAmp) + '%';
            boat.style.transform = `scaleX(-1) rotate(${angle.toFixed(2)}deg)`;
          }
          // 每4幀記一次船尾水波（stern=左側，waterline=top+11%）
          if (frame % 2 === 0 && window._wakeEmit) {
            const wy = y + Math.sin(t * wFreq) * wAmp + 11;
            window._wakeEmit(x, wy, 1, 4.5);   // dirX=1 船往右，stern 在左
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();

      // ── 小帆船：由右往左，底部海面 ──
      (function () {
        const boat  = document.querySelector('[data-boat]');
        const baseY = 84.0, speed = 0.055, wAmp = 0.28, wFreq = 0.7, maxRot = 1.2;
        let x = 102, last = null, frame = 0;
        function tick(ts) {
          if (!last) last = ts;
          const dt = Math.min((ts - last) / 1000, 0.1);
          last = ts; frame++;
          const t = ts / 1000;
          x -= speed * dt * 60;
          if (x < -12) x = 102;
          const y = baseY + Math.sin(t * wFreq) * wAmp;
          if (boat) {
            boat.style.left      = x + '%';
            boat.style.width     = '4%';
            boat.style.top       = y + '%';
            boat.style.transform = `rotate(${(Math.sin(t * wFreq * 0.65 + 1) * maxRot).toFixed(2)}deg)`;
          }
          // 每4幀記一次，stern=右側 x+4%，waterline=top+10%
          if (frame % 2 === 0 && window._wakeEmit) {
            window._wakeEmit(x + 4, y + 10, -1, 4.0);  // dirX=-1 船往左，stern 在右
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();

      // ── 船尾水波粒子系統 ──
      (function () {
        const canvas = document.getElementById('wake-canvas');
        if (!canvas) return;

        // 粒子池
        const particles = [];
        // 供船隻動畫呼叫：emit(x%, y%, dirX, boatW%)
        window._wakeEmit = function(cx, cy, dirX, boatPct) {
          const W = canvas.width, H = canvas.height;
          if (!W || !H) return;
          const bw = boatPct / 100 * W;
          // 每次發射 3 顆，分上中下三道
          for (let i = 0; i < 3; i++) {
            const side   = (i - 1);           // -1, 0, +1
            const spread = side * bw * 0.22;  // 上下偏移
            // 速度：沿 -dirX 方向退後，垂直方向往外散開
            const vx = -dirX * (0.06 + Math.random() * 0.05) * W / 100;
            const vy = (spread > 0 ? 1 : spread < 0 ? -1 : (Math.random() > 0.5 ? 1 : -1))
                       * (0.04 + Math.random() * 0.06) * H / 100;
            particles.push({
              x:     cx / 100 * W,
              y:     cy / 100 * H + spread,
              vx, vy,
              r:     bw * (0.04 + Math.random() * 0.05),  // 泡沫半徑
              alpha: 0.32 + Math.random() * 0.12,
              life:  0,
              maxLife: 900 + Math.random() * 700,          // ms
            });
          }
        };

        function resizeCanvas() {
          const W = canvas.offsetWidth, H = canvas.offsetHeight;
          if (W > 0 && H > 0 && (canvas.width !== W || canvas.height !== H)) {
            canvas.width = W; canvas.height = H;
          }
        }

        // Nuclear Isle 多邊形（SVG 座標 viewBox 1672×941），轉成比例
        const NUCLEAR_POLY = [
          [105,548],[232,470],[391,488],[535,548],
          [558,658],[439,710],[226,708],[100,632]
        ].map(([x,y]) => [x/1672, y/941]);

        function clipExcludeNuclear(ctx, W, H) {
          ctx.beginPath();
          ctx.rect(0, 0, W, H);
          const pts = NUCLEAR_POLY;
          ctx.moveTo(pts[0][0]*W, pts[0][1]*H);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0]*W, pts[i][1]*H);
          ctx.closePath();
          ctx.clip('evenodd');
        }

        let last = null;
        function draw(ts) {
          resizeCanvas();
          const W = canvas.width, H = canvas.height;
          if (!W || !H) { requestAnimationFrame(draw); return; }
          const dt = last ? Math.min(ts - last, 50) : 16; last = ts;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, W, H);
          ctx.save();
          clipExcludeNuclear(ctx, W, H);
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life += dt;
            if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
            const frac = p.life / p.maxLife;
            p.x += p.vx * (1 - frac * 0.7);
            p.y += p.vy * (1 - frac * 0.7);
            const rScale = frac < 0.3 ? (1 + frac * 1.5) : (1.45 - frac * 1.1);
            const r = Math.max(0.5, p.r * rScale);
            const a = p.alpha * (1 - frac) * (1 - frac);
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
            ctx.fill();
          }
          ctx.restore();
          requestAnimationFrame(draw);
        }
        requestAnimationFrame(() => requestAnimationFrame(draw));
      })();

      // ── 中央大船 ──
      (function () {
        const boat = document.querySelector('[data-boat-center]');
        function getY(x) { return x < 30 ? 40 : 40 + 0.20 * (x - 30); }
        const x0 = -10, speed = 0.032, wAmp = 0.12, wFreq = 0.38, maxRot = 0.8;
        let x = x0, last = null, frame = 0;
        function tick(ts) {
          if (!last) last = ts;
          const dt = Math.min((ts - last) / 1000, 0.1); last = ts; frame++;
          const t = ts / 1000;
          x += speed * dt * 60;
          if (x > 112) x = x0;
          const y = getY(x);
          const rock = Math.sin(t * wFreq * 0.6 + 0.8) * maxRot;
          const angle = x < 30 ? (-1.5 + rock) : (2 + rock);
          if (boat) {
            boat.style.left = x + '%';
            boat.style.top = (y + Math.sin(t * wFreq) * wAmp) + '%';
            boat.style.transform = `scaleX(-1) rotate(${angle.toFixed(2)}deg)`;
          }
          if (frame % 2 === 0 && window._wakeEmit) {
            const wy = y + Math.sin(t * wFreq) * wAmp + 11;
            window._wakeEmit(x, wy, 1, 4.5);
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();

      // ── 小帆船 ──
      (function () {
        const boat = document.querySelector('[data-boat]');
        const baseY = 84.0, speed = 0.055, wAmp = 0.28, wFreq = 0.7, maxRot = 1.2;
        let x = 102, last = null, frame = 0;
        function tick(ts) {
          if (!last) last = ts;
          const dt = Math.min((ts - last) / 1000, 0.1); last = ts; frame++;
          const t = ts / 1000;
          x -= speed * dt * 60;
          if (x < -12) x = 102;
          const y = baseY + Math.sin(t * wFreq) * wAmp;
          if (boat) {
            boat.style.left = x + '%'; boat.style.width = '4%';
            boat.style.top = y + '%';
            boat.style.transform = `rotate(${(Math.sin(t * wFreq * 0.65 + 1) * maxRot).toFixed(2)}deg)`;
          }
          if (frame % 2 === 0 && window._wakeEmit) {
            window._wakeEmit(x + 4, y + 10, -1, 4.0);
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
